name: Stats scoreboard

on:
  schedule:
    - cron: "17 6 * * *"   # every day
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/scoreboard.yml"]

permissions:
  contents: write

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch numbers and redraw the scoreboard
        run: python3 scripts/scoreboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scoreboard.svg assets/stats.json
          git diff --cached --quiet || git commit -m "Update stats scoreboard"
          git push
